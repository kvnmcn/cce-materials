<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Name | Laboratory 2</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body>
    <div class="container vh-100">
        <div class="row vh-100 align-items-center justify-content-center ">
            <div class="col-5">
                <div class="row mb-3">
                    <h1 class="p-0">Welcome back</h1>
                    <small class="p-0 text-secondary">Please enter your details</small>
                </div>
                <!-- github @kvnmcn -->
                <form action="">
                    <div class="row mb-3">
                        <label for="email" class="p-0 form-label">Email address</label>
                        <input type="email" class="form-control"  name="email" id="email">
                    </div>
                    <div class="row mb-3">
                        <label for="pw" class="p-0 form-label">Password</label>
                        <input type="password" class="form-control" name="pw" id="pw">
                    </div>
                    <div class="row justify-content-between mb-3">
                        <div class="col p-0">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" value="" id="defaultCheck1">
                                <label class="form-check-label" for="defaultCheck1">
                                    Remember for 30 days
                                </label>
                            </div>
                        </div>
                        <div class="col p-0 text-end"><a href="#">Forgot Password</a></div>
                    </div>
                
                    <div class="row mb-3"><button type="button" class="btn btn-primary">Sign in</button></div>
                    <div class="row mb-3">
                        <button type="button" class="btn btn-outline-primary"> <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-google" viewBox="0 0 16 16">
                            <path d="M15.545 6.558a9.42 9.42 0 0 1 .139 1.626c0 2.434-.87 4.492-2.384 5.885h.002C11.978 15.292 10.158 16 8 16A8 8 0 1 1 8 0a7.689 7.689 0 0 1 5.352 2.082l-2.284 2.284A4.347 4.347 0 0 0 8 3.166c-2.087 0-3.86 1.408-4.492 3.304a4.792 4.792 0 0 0 0 3.063h.003c.635 1.893 2.405 3.301 4.492 3.301 1.078 0 2.004-.276 2.722-.764h-.003a3.702 3.702 0 0 0 1.599-2.431H8v-3.08h7.545z" />
                        </svg>  Sign in with Google</button>
                    </div>
                    
                    <div class="row text-center">
                        <div>Don't have an account? <a href="">Sign up</a></div>
                    </div>
                </form>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
